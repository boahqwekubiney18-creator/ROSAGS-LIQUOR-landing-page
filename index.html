<!DOCTYPE html>
<html>
<head>
<title>My First Website</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
font-family: Arial, sans-serif;
text-align: center;
background: linear-gradient(135deg, #cc0000, #ffffff);
color: #222;
padding: 100px 20px;
margin: 0;
min-height: 100vh;
box-sizing: border-box;
}

.container {
background: white;
color: #333;
padding: 40px 20px;
border-radius: 20px;
max-width: 600px;
margin: auto;
box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

h1 {
color: #cc0000;
font-size: 32px;
}

p {
font-size: 18px;
}

button {
background: #cc0000;
color: white;
padding: 14px 25px;
border: none;
border-radius: 8px;
font-size: 16px;
cursor: pointer;
}

button:hover {
background: #990000;
}
</style>
</head>

<body>
<div class="container">
<h1>Welcome to My Website!</h1>
<p>My website is now live on Cloudflare.</p>
<button onclick="alert('Welcome! Thanks for visiting my website!')">
Get Started
</button>
</div>
</body>
</html>
